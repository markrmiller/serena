# the name by which the project can be referenced within Serena
project_name: "project_name"


# list of languages for which language servers are started; choose from:
#   al                  angular             ansible             bash                clojure
#   cpp                 cpp_ccls            crystal             csharp              csharp_omnisharp
#   dart                elixir              elm                 erlang              fortran
#   fsharp              go                  groovy              haskell             haxe
#   hlsl                html                java                json                julia
#   kotlin              lean4               lua                 luau                markdown
#   matlab              msl                 nix                 ocaml               pascal
#   perl                php                 php_phpactor        powershell          python
#   python_jedi         python_ty           r                   rego                ruby
#   ruby_solargraph     rust                scala               scss                solidity
#   svelte              swift               systemverilog       terraform           toml
#   typescript          typescript_vts      vue                 yaml                zig
#   (This list may be outdated. For the current list, see values of Language enum here:
#   https://github.com/oraios/serena/blob/main/src/solidlsp/ls_config.py
#   For some languages, there are alternative language servers, e.g. csharp_omnisharp, ruby_solargraph.)
# Note:
#   - For C, use cpp
#   - For JavaScript, use typescript
#   - For Angular projects, use angular (subsumes typescript+html; requires `npm install` in the project root)
#   - For Svelte projects, use svelte (subsumes typescript/javascript for .svelte projects; requires npm)
#   - For SCSS / Sass / plain CSS, use scss (some-sass-language-server handles all three)
#   - For Free Pascal/Lazarus, use pascal
# Special requirements:
#   Some languages require additional setup/installations.
#   See here for details: https://oraios.github.io/serena/01-about/020_programming-languages.html#language-servers
# When using multiple languages, the first language server that supports a given file will be used for that file.
# The first language is the default language and the respective language server will be used as a fallback.
# Note that when using the JetBrains backend, language servers are not used and this list is correspondingly ignored.
languages: ["python"]

# the encoding used by text files in the project
# For a list of possible encodings, see https://docs.python.org/3.11/library/codecs.html#standard-encodings
encoding: "utf-8"

# line ending convention to use when writing source files.
# Possible values: unset (use global setting), "lf", "crlf", or "native" (platform default)
# This does not affect Serena's own files (e.g. memories and configuration files), which always use native line endings.
line_ending:

# The language backend to use for this project.
# If not set, the global setting from serena_config.yml is used.
# Valid values: LSP, JetBrains
# Note: the backend is fixed at startup. If a project with a different backend
# is activated post-init, an error will be returned.
language_backend:

# whether to use project's .gitignore files to ignore files
ignore_all_files_in_gitignore: true

# advanced configuration option allowing to configure language server-specific options.
# Maps the language key to the options.
# Have a look at the docstring of the constructors of the LS implementations within solidlsp (e.g., for C# or PHP) to see which options are available.
# No documentation on options means no options are available.
ls_specific_settings: {}

# optional Java-only compiler-backed refactoring sidecar.
# Disabled by default; Java-specific tools should be included explicitly and generic routing is opt-in.
java_refactor:
  # whether compiler-backed Java refactoring tools are enabled for this project. When false, the status tool may
  # still report "disabled", but semantic/mutating Java refactor operations refuse with code "java_refactor_disabled".
  enabled: false
  # whether generic routed tools (rename_symbol / safe_delete_symbol) preview by default instead of applying.
  preview_default: true
  # path to the JDK used to launch the sidecar (must be a JDK, not a JRE). Empty uses the "java" on PATH.
  java_home:
  # annotation processing mode for sidecar analysis. One of:
  #   "none"      - disable annotation processing entirely (javac -proc:none).
  #   "classpath" - discover annotation processors on the regular compile classpath (javac default).
  #   "project"   - run only the project's declared annotation processors via a dedicated processor path
  #                 (falls back to no processors if the project declares none).
  annotation_processing: "none"
  # incomplete-analysis (unresolved compiler diagnostics, e.g. broken/partial classpath) behavior:
  # PREVIEW is always available with an explicit warning; APPLY is refused unless this is true. With the opt-in,
  # apply tolerates only the PRE-EXISTING diagnostics — an edit that introduces NEW compiler errors is still refused.
  allow_incomplete_analysis: false
  # opt-in routing from the generic rename_symbol / safe_delete_symbol tools to the sidecar for .java files.
  # NOTE the contract change vs. the generic LSP tools: with preview_default true (the default), a routed call returns
  # a PREVIEW (structured JSON, no files written) instead of mutating immediately; a hard engine refusal is surfaced
  # verbatim and does NOT fall through to the LSP path. The LSP path remains the fallback only when the engine is
  # unavailable (disabled, missing jar, sidecar failure) or the file is not Java.
  route_generic_rename: false
  route_generic_safe_delete: false
  # whether Java-specific refactor tools may resolve name_path through Serena's language-server symbol tree. When false,
  # pass explicit one-based line/column to the Java tools; name_path requests refuse with a configuration error instead
  # of silently depending on LSP symbol identity.
  use_lsp_symbol_resolution: true
  # maximum number of Java source files the sidecar will index before refusing.
  max_files: 10000
  # JVM max-heap for the sidecar process (e.g. "2G", "512m").
  max_heap: "2G"
  # whether a PREVIEW runs the staged (in-memory) javac validation path without writing any files, reporting the result
  # under `previewValidation` (distinct from apply-time validation). This is real preview validation, not an alias.
  validate_after_preview: true
  # whether an APPLY first re-runs javac against the staged (post-edit) sources in memory and refuses without writing
  # if that validation fails. Setting this false skips only that pre-commit step; post-apply validation with rollback
  # always runs and cannot be configured off, so a compiler-breaking edit is still rolled back.
  validate_before_apply: true

  # build-model discovery mode. Selects how the sidecar resolves source roots, classpaths, and compiler settings:
  #   "auto"     - detect the build tool from project files (Gradle settings/build files or pom.xml), else plain javac.
  #   "explicit" - ignore build tools; use the source_roots/classpath/module_path configured below.
  #   "maven"    - force real Maven extraction (help:effective-pom + dependency:build-classpath).
  #   "gradle"   - force real Gradle extraction (via a bundled init script).
  #   "plain"    - force conventional source-layout discovery (src/main/java, src/test/java, ...) with no classpath.
  # (the implementation alias `build_tool_mode` is also accepted.)
  build_tool_model: "auto"
  # whether semantic rename also rewrites Javadoc {@link}/references to the renamed element (compiler-located DocTree
  # edits). Default for the rename tools' include_javadocs parameter when the caller leaves it unset.
  # (the implementation alias `include_javadocs` is also accepted.)
  include_javadocs_default: false
  # whether semantic rename also rewrites plain-comment and string-literal occurrences of the old name (best-effort
  # textual matches, surfaced with a warning). Default for the rename tools' include_comments parameter when unset.
  # (the implementation alias `include_comments` is also accepted.)
  include_comments_default: false
  # whether build-model discovery reuses Serena's Java language-server settings from ls_specific_settings["java"]
  # (maven_user_settings, gradle_user_home, gradle_java_home, gradle_wrapper_enabled) so the sidecar resolves
  # dependencies the same way the language server does. Set false to ignore those settings during extraction.
  use_jdtls_settings: true

  # Explicit project-model overrides forwarded to the sidecar's javac session. These let projects with
  # non-conventional layouts, external dependencies, or modular builds be analyzed without a full Gradle/Maven
  # model extraction (most relevant when build_tool_model is "explicit"). Paths may be project-root-relative or absolute.
  # additional source roots to compile/index beyond those discovered from the build model.
  source_roots: []
  # compile/analysis classpath entries (jars or class directories).
  classpath: []
  # module path entries for modular (JPMS) projects.
  module_path: []
  # javac --release target (e.g. "17"). Mutually preferred over source/target when set.
  release:
  # javac -source level (e.g. "17"); used when release is unset.
  source:
  # javac -target level (e.g. "17"); used when release is unset.
  target:
  # source-file encoding for reading/writing edits. Defaults to the Serena project encoding when unset.
  encoding:
  # directory names pruned while discovering Java sources (sent to the sidecar as the initialize contract's
  # ignoredPatterns). An explicit list fully replaces the default below; an explicit empty list ([]) prunes nothing.
  ignored_patterns: [".git", ".gradle", ".serena", "build", "target", "out"]

# list of additional workspace folder paths for cross-package reference support (e.g. in monorepos).
# Paths can be absolute or relative to the project root.
# Each folder is registered as an LSP workspace folder, enabling language servers to discover
# symbols and references across package boundaries.
# Currently supported for: TypeScript.
# Example:
#   additional_workspace_folders:
#     - ../sibling-package
#     - ../shared-lib
additional_workspace_folders: []

# list of additional paths to ignore in this project.
# Same syntax as gitignore, so you can use * and **.
# Note: global ignored_paths from serena_config.yml are also applied additively.
ignored_paths: []

# whether the project is in read-only mode
# If set to true, all editing tools will be disabled and attempts to use them will result in an error
# Added on 2025-04-18
read_only: false

# list of tool names to exclude.
# This extends the existing exclusions (e.g. from the global configuration)
# Find the list of tools here: https://oraios.github.io/serena/01-about/035_tools.html
excluded_tools: []

# list of tools to include that would otherwise be disabled (particularly optional tools that are disabled by default).
# This extends the existing inclusions (e.g. from the global configuration).
# Find the list of tools here: https://oraios.github.io/serena/01-about/035_tools.html
included_optional_tools: []

# fixed set of tools to use as the base tool set (if non-empty), replacing Serena's default set of tools.
# This cannot be combined with non-empty excluded_tools or included_optional_tools.
# Find the list of tools here: https://oraios.github.io/serena/01-about/035_tools.html
fixed_tools: []

# list of mode names that are to be activated by default, overriding the setting in the global configuration.
# The full set of modes to be activated is base_modes (from global config) + default_modes + added_modes.
# If the setting is undefined/empty, the default_modes from the global configuration (serena_config.yml) apply.
# Otherwise, this overrides the setting from the global configuration (serena_config.yml).
# Therefore, you can set this to [] if you do not want the default modes defined in the global config to apply
# for this project.
# This setting can, in turn, be overridden by CLI parameters (--mode).
# See https://oraios.github.io/serena/02-usage/050_configuration.html#modes
default_modes:

# list of mode names to be activated additionally for this project, e.g. ["query-projects"]
# The full set of modes to be activated is base_modes (from global config) + default_modes + added_modes.
# See https://oraios.github.io/serena/02-usage/050_configuration.html#modes
added_modes:

# initial prompt for the project. It will always be given to the LLM upon activating the project
# (contrary to the memories, which are loaded on demand).
initial_prompt: ""

# time budget (seconds) per tool call for the retrieval of additional symbol information
# such as docstrings or parameter information.
# This overrides the corresponding setting in the global configuration; see the documentation there.
# If null or missing, use the setting from the global configuration.
symbol_info_budget:

# list of regex patterns which, when matched, mark a memory entry as read‑only.
# Extends the list from the global configuration, merging the two lists.
read_only_memory_patterns: []

# list of regex patterns for memories to completely ignore.
# Matching memories will not appear in list_memories or activate_project output
# and cannot be accessed via read_memory or write_memory.
# To access ignored memory files, use the read_file tool on the raw file path.
# Extends the list from the global configuration, merging the two lists.
# Example: ["_archive/.*", "_episodes/.*"]
ignored_memory_patterns: []
