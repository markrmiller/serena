import groovy.json.JsonOutput

// Serena build-model extraction init script. Registers a `dumpSerenaModel` task on every project that, when run,
// writes a normalized JSON description of each Java source set (roots, generated roots, resolved compile classpath,
// and compiler settings) to a PER-PROJECT file under the base directory named by the `serena.model.outDir` system
// property. Each project writes its OWN file (derived from its project path), so a multi-project build where several
// subprojects have Java sources does not have later projects overwrite earlier ones. The Java side then globs and
// merges these per-project files. It adds no dependencies to the user's build and never mutates it; it is injected only
// for the duration of the extraction invocation.
allprojects { p ->
    p.tasks.register("dumpSerenaModel") {
        doLast {
            def modules = []
            // Build discriminator: the root (top-level) build has no parent and contributes project ids verbatim
            // (':', ':a', ...). A project belonging to an INCLUDED build (Gradle composite, `includeBuild(...)`) is
            // qualified with its build's name so its ':' root project does not collide with the root build's ':' root
            // when grouped by project id on the Java side, and so two separate builds' `main` source sets stay distinct.
            def includedBuildName = (p.gradle.parent == null) ? "" : p.rootProject.name
            def projectKey = includedBuildName.isEmpty()
                    ? p.path
                    : (":" + includedBuildName + (p.path == ":" ? "" : p.path))
            p.plugins.withId("java") {
                p.extensions.getByName("sourceSets").each { ss ->
                    def compileTask = p.tasks.findByName(ss.compileJavaTaskName)
                    def existingSrcDirs = ss.java.srcDirs.findAll { it.exists() }
                    def generatedRootSet = new LinkedHashSet<String>()
                    // Heuristic: any source dir under a conventional /generated/ path is a generated root.
                    existingSrcDirs.findAll { it.path.replace('\\', '/').contains('/generated/') }.each {
                        generatedRootSet.add(it.absolutePath)
                    }
                    // Authoritative: the compile task's annotation-processor generated-sources output directory (a real
                    // generated output that may live OUTSIDE a /generated/ path and may not be registered as a srcDir).
                    // Only report it when it actually exists on disk: in a project that has never been built this default
                    // output dir does not exist yet and has no sources, so reporting it would add a phantom generated root
                    // that is absent from sourceRoots (which list only existing dirs), violating the generatedRoot ⊆
                    // sourceRoots invariant the Java side asserts.
                    try {
                        def genOut = compileTask?.options?.generatedSourceOutputDirectory?.getOrNull()?.asFile
                        if (genOut != null && genOut.exists()) {
                            generatedRootSet.add(genOut.absolutePath)
                        }
                    } catch (Exception ignored) {
                        // Older Gradle without generatedSourceOutputDirectory: the /generated/ heuristic still applies.
                    }
                    def generatedRoots = generatedRootSet as List
                    // sourceRoots (reported as srcDirs to the Java side) must be the union of the configured source dirs
                    // and ALL generated roots, deduplicated. This satisfies the invariant that every generatedRoot ⊆
                    // sourceRoots (exactly once). Some generated roots (e.g. the default annotationProcessor output dir)
                    // are not registered as srcDirs in the source set but must still appear in sourceRoots so callers can
                    // locate files under them. The Java side uses .distinct() when building analysisRoots, so adding a
                    // generated root to both srcDirs and generatedRoots never causes javac to see the same root twice.
                    def srcDirsSet = new LinkedHashSet<String>(existingSrcDirs*.absolutePath)
                    srcDirsSet.addAll(generatedRoots)
                    def srcDirs = srcDirsSet as List
                    // B11 model-first resource roots: the source set's CONFIGURED resource directories
                    // (sourceSets.<name>.resources.srcDirs), emitted as a SEPARATE field from srcDirs so the Java side
                    // can carry true resource roots — including a NON-conventional one declared via
                    // `resources.srcDir('res')` — instead of re-deriving them from the "resources" filename convention.
                    // Only existing directories are reported (mirroring existingSrcDirs), de-duplicated, order preserved.
                    def resourceDirs = []
                    try {
                        def resourceDirSet = new LinkedHashSet<String>()
                        ss.resources.srcDirs.findAll { it.exists() }.each { resourceDirSet.add(it.absolutePath) }
                        resourceDirs = resourceDirSet as List
                    } catch (Exception ignored) {
                        // A source set without a resources sourceDirectorySet (or an older Gradle API) reports no resource
                        // dirs; the Java side then falls back to the "resources" filename convention for this source set.
                    }
                    def classpath = []
                    // G004: a compile classpath that cannot be resolved (e.g. an unresolvable dependency offline) must NOT
                    // be silently surfaced as an empty-but-proven classpath — that would let a mutating edit proceed against
                    // a model that is missing real dependencies, leaving javac "clean" on the edited file while corrupting
                    // overload resolution / type hierarchy elsewhere. Mark this source set classpath-UNPROVEN so the Java
                    // side refuses apply (the same gate Maven uses for an unresolved scope), while preview still works.
                    def classpathProven = true
                    try {
                        classpath = ss.compileClasspath.files*.absolutePath
                    } catch (Exception ignored) {
                        classpathProven = false
                    }
                    def annotationProcessorPath = []
                    try {
                        annotationProcessorPath = p.configurations.findByName(ss.annotationProcessorConfigurationName)?.files*.absolutePath ?: []
                    } catch (Exception ignored) {
                        // An unresolvable annotation-processor configuration is surfaced as an empty processor path;
                        // the "project" annotation-processing mode then degrades to no processors (-proc:none).
                    }
                    // The compiled-class output directory (typically build/classes/java/<sourceSet>). Reported so the
                    // Java side can expose per-source-set outputDirs in the project model.
                    def outputDirs = []
                    try {
                        outputDirs = ss.output.classesDirs.files*.absolutePath
                    } catch (Exception ignored) {
                        // An unresolvable output is surfaced as no output dirs; this is informational only.
                    }
                    // Kotlin/JVM mixed projects put javac-visible symbols in the Kotlin compile output. Gradle usually
                    // wires that directory into the source set output, but capture the task destination explicitly so the
                    // Java side still sees it when plugin/version differences omit it from ss.output.classesDirs.
                    try {
                        def kotlinTaskName = ss.name == 'main' ? 'compileKotlin' : 'compile' + ss.name.capitalize() + 'Kotlin'
                        def kotlinTask = p.tasks.findByName(kotlinTaskName)
                        def kotlinOut = kotlinTask?.destinationDirectory?.getOrNull()?.asFile
                        if (kotlinOut != null) {
                            outputDirs = (outputDirs + [kotlinOut.absolutePath]).unique()
                            // Java sources in a mixed module resolve Kotlin-compiled symbols from this directory, so it must
                            // be on the javac compile classpath — not only outputDirs (which is informational). Adding it
                            // here makes Java->Kotlin resolution work even when plugin/version differences omit the Kotlin
                            // output from ss.compileClasspath.
                            classpath = (classpath + [kotlinOut.absolutePath]).unique()
                        }
                    } catch (Exception ignored) {
                        // Projects without Kotlin or older Kotlin Gradle plugin APIs simply have no extra output dir.
                    }
                    // For a modular source set (one whose sources include a module-info.java), javac must receive the
                    // compile dependencies on the --module-path rather than the classpath. Gradle resolves the same
                    // files for both, so reuse the resolved compile classpath as the module path when modular.
                    def modular = existingSrcDirs.any { new File(it, 'module-info.java').exists() }
                    def modulePath = modular ? classpath : []
                    // The real, effective extra compiler arguments configured on the compile task. These carry flags the
                    // reconstructed javacOptions would otherwise miss (--enable-preview, --add-exports, --add-opens,
                    // -parameters, -Akey=value processor options, custom -Xlint settings, etc.). Captured verbatim so the
                    // Java side can merge them into javacOptions and pass them to javac exactly as the build would.
                    def compilerArgs = []
                    try {
                        compilerArgs = (compileTask?.options?.compilerArgs ?: []).collect { it.toString() }
                    } catch (Exception ignored) {
                        // An unreadable compilerArgs list is surfaced as none; the reconstructed base options still apply.
                    }
                    // The -parameters flag is exposed as a typed boolean property on CompileOptions rather than as a raw
                    // compiler arg, so capture it separately and synthesize the flag the build would effectively pass.
                    try {
                        if (compileTask?.options?.parameters?.getOrNull()) {
                            if (!compilerArgs.contains('-parameters')) {
                                compilerArgs = compilerArgs + ['-parameters']
                            }
                        }
                    } catch (Exception ignored) {
                        // Older Gradle without options.parameters: rely on whatever appears in compilerArgs.
                    }
                    // A Java toolchain selects WHICH javac binary runs; it does NOT imply `--release N`. Gradle already
                    // derives sourceCompatibility/targetCompatibility from the toolchain, so those flow through as
                    // source/target. `release` is reported ONLY when the build explicitly set `options.release`, because
                    // synthesizing `--release` from the toolchain would (a) diverge from what the real build passes and
                    // (b) make legal builds illegal — e.g. `--add-exports jdk.compiler/...` is rejected under `--release`.
                    // Project-to-project dependency edges: the paths of the sibling Gradle projects this source set's
                    // compile classpath depends on (`implementation project(':a')`, etc.). The Java side maps each to the
                    // depended project's `main` source set so its source roots feed this set's -sourcepath, letting a
                    // dependent project resolve a depended project's symbols from SOURCE even when it has not been built.
                    def dependsOnProjects = new LinkedHashSet<String>()
                    try {
                        def cfg = p.configurations.findByName(ss.compileClasspathConfigurationName)
                        if (cfg != null) {
                            cfg.allDependencies.withType(org.gradle.api.artifacts.ProjectDependency).each { pd ->
                                try {
                                    dependsOnProjects.add(pd.dependencyProject.path)
                                } catch (Throwable ignoredDep) {
                                    // Gradle 9 removed ProjectDependency.dependencyProject; the project path is on pd.path.
                                    try { dependsOnProjects.add(pd.path) } catch (Throwable ignoredPath) {}
                                }
                            }
                        }
                    } catch (Exception ignored) {
                        // An unresolvable configuration yields no project edges; cross-module symbols then fall back to
                        // whatever the resolved classpath provides (e.g. a prebuilt jar), exactly as before.
                    }
                    modules << [
                            project                : projectKey,
                            sourceSet              : ss.name,
                            srcDirs                : srcDirs,
                            resourceDirs           : resourceDirs,
                            generatedRoots         : generatedRoots,
                            outputDirs             : outputDirs,
                            classpath              : classpath,
                            modulePath             : modulePath,
                            annotationProcessorPath: annotationProcessorPath,
                            dependsOnProjects      : dependsOnProjects as List,
                            compilerArgs           : compilerArgs,
                            classpathUnproven      : !classpathProven,
                            release       : compileTask?.options?.release?.orNull?.toString(),
                            source        : compileTask?.sourceCompatibility,
                            target        : compileTask?.targetCompatibility,
                            encoding      : compileTask?.options?.encoding
                    ]
                }
            }
            // Write one file per project so subprojects never clobber each other's source sets. The project path is the
            // unique key (':' for the root, ':a', ':a:b', ...); ':' is not a legal file-name char on all platforms, so
            // it is replaced with '_'. The Java side merges every file in this directory.
            def base = new File(System.getProperty("serena.model.outDir"))
            base.mkdirs()
            // The file name is derived from the project's absolute directory, which is globally unique across the root
            // build AND every included build, so no project ever clobbers another's file (the simple ':'->'_' scheme
            // collided between the root build's root project and an included build's root project, both ':'). The Java
            // side globs and merges every file in this directory.
            def safeName = p.projectDir.absolutePath.replaceAll('[^A-Za-z0-9]', '_')
            if (safeName.isEmpty()) {
                safeName = '_'
            }
            def out = new File(base, safeName + ".json")
            out.text = JsonOutput.toJson([modules: modules])
        }
    }
}

// Composite builds: an init script is applied to every build in the composite, so `dumpSerenaModel` is registered on the
// included builds' projects too, but running `dumpSerenaModel` by name only executes it in the ROOT build. From the
// top-level build (the one with no parent), make the root project's task depend on each included build's root
// `dumpSerenaModel` so the included builds' source sets are extracted and merged alongside the root build's.
if (gradle.parent == null) {
    gradle.rootProject { rp ->
        rp.tasks.named("dumpSerenaModel").configure { aggregate ->
            gradle.includedBuilds.each { ib ->
                try {
                    aggregate.dependsOn(ib.task(":dumpSerenaModel"))
                } catch (Exception ignored) {
                    // An included build without the task (e.g. a non-Gradle or incompatible build) is simply skipped;
                    // its sources fall back to whatever the resolved classpath provides, exactly as before.
                }
            }
        }
    }
}
